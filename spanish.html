<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-image: url("background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .page {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 40px;
        }

        .logo {
            width: 350px;
            max-width: 85%;
            height: auto;
            display: block;
            margin-bottom: 40px;
        }

        .services {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .service {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            color: black;
            padding: 10px;
            cursor: pointer;
        }

        .service-image {
            width: 250px;
            height: 250px;
            object-fit: contain;
            display: block;
            margin-right: 35px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .service:hover .service-image {
            transform: scale(1.05);
        }

        .service-name {
            font-size: 34px;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
        }

        .back {
            margin-top: 45px;
            text-align: center;
        }

        .back img {
            width: 150px;
            height: auto;
        }

        /* FULL-SCREEN IMAGE VIEWER */

        .image-viewer {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        .image-viewer img {
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .close-viewer {
            position: absolute;
            top: 15px;
            right: 25px;
            color: white;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
            z-index: 1001;
        }

        .close-viewer:hover {
            color: #cccccc;
        }

        @media (max-width: 600px) {

            .page {
                padding: 20px 15px 30px;
            }

            .logo {
                width: 300px;
                max-width: 90%;
                margin-bottom: 30px;
            }

            .services {
                gap: 18px;
            }

            .service {
                padding: 8px;
            }

            .service-image {
                width: 115px;
                height: 115px;
                margin-right: 20px;
            }

            .service-name {
                font-size: 24px;
            }

            .back {
                margin-top: 35px;
            }

            .back img {
                width: 120px;
            }

            .close-viewer {
                top: 10px;
                right: 18px;
                font-size: 42px;
            }

            .image-viewer {
                padding: 0;
            }

            .image-viewer img {
                max-width: 100vw;
                max-height: 100vh;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <img src="logo.png" alt="Logo de la empresa" class="logo">

    <div class="services">

        <div class="service" onclick="enlargeImage('paint.jpg')">
            <img src="paint.jpg" alt="Pintura" class="service-image">
            <div class="service-name">Trabajos de Pintura</div>
        </div>

        <div class="service" onclick="enlargeImage('shower.jpg')">
            <img src="shower.jpg" alt="Duchas y Baños" class="service-image">
            <div class="service-name">Duchas y Baños</div>
        </div>

        <div class="service" onclick="enlargeImage('restroom.jpg')">
            <img src="restroom.jpg" alt="Lavabos, Inodoros y Bidés" class="service-image">
            <div class="service-name">Lavabos, Inodoros y Bidés</div>
        </div>

        <div class="service" onclick="enlargeImage('waterheater.jpg')">
            <img src="waterheater.jpg" alt="Termos Eléctricos" class="service-image">
            <div class="service-name">Termos Eléctricos</div>
        </div>

        <div class="service" onclick="enlargeImage('kitchensink.jpg')">
            <img src="kitchensink.jpg" alt="Fregaderos y Grifos de Cocina" class="service-image">
            <div class="service-name">Fregaderos y Grifos de Cocina</div>
        </div>

        <div class="service" onclick="enlargeImage('cealingfan.jpg')">
            <img src="cealingfan.jpg" alt="Ventiladores de Techo" class="service-image">
            <div class="service-name">Ventiladores de Techo</div>
        </div>

        <div class="service" onclick="enlargeImage('doorfix.jpg')">
            <img src="doorfix.jpg" alt="Arreglos de puertas y ventanas" class="service-image">
            <div class="service-name">Arreglos de puertas y ventanas</div>
        </div>

        <div class="service" onclick="enlargeImage('cabinet.jpg')">
            <img src="cabinet.jpg" alt="Reparación o instalación de muebles de cocina" class="service-image">
            <div class="service-name">Reparación o instalación de muebles de cocina</div>
        </div>

    </div>

    <div class="back">
        <a href="javascript:history.back()">
            <img src="back.png" alt="Atrás">
        </a>
    </div>

</div>

<!-- FULL-SCREEN IMAGE VIEWER -->

<div id="imageViewer" class="image-viewer" onclick="closeImage()">

    <span class="close-viewer" onclick="closeImage(event)">×</span>

    <img id="largeImage" src="" alt="Imagen ampliada">

</div>

<script>

function enlargeImage(imageSource) {
    var viewer = document.getElementById("imageViewer");
    var largeImage = document.getElementById("largeImage");

    largeImage.src = imageSource;
    viewer.style.display = "flex";
}

function closeImage(event) {

    if (event) {
        event.stopPropagation();
    }

    document.getElementById("imageViewer").style.display = "none";
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Información</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-image: url("background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            min-height: 100vh;

            display: flex;
            justify-content: center;
        }

        .page {
            width: 100%;
            max-width: 900px;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 30px 20px 25px;
        }

        /* TOP LOGO */

        .logo {
            width: 350px;
            max-width: 80%;
            height: auto;
            display: block;
            margin-bottom: 35px;
        }

        /* INFORMATION */

        .information {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 35px;
            text-align: center;
        }

        /* LANGUAGE OPTIONS */

        .languages {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 70px;
            width: 100%;
        }

        .language {
            text-decoration: none;
            color: black;
            text-align: center;

            display: flex;
            flex-direction: column;
            align-items: center;

            transition: transform 0.2s ease;
        }

        .language:hover {
            transform: scale(1.05);
        }

        .language img {
            width: 150px;
            height: auto;
            display: block;
            margin-bottom: 15px;
        }

        .language-name {
            font-size: 27px;
            font-weight: bold;
        }

        /* EMAIL */

        .email {
            margin-top: auto;
            padding-top: 35px;
            text-align: center;
        }

        .email img {
            width: 75px;
            height: auto;
            display: block;
            margin: 0 auto 8px;
        }

        .email a {
            color: black;
            text-decoration: none;
            font-size: 18px;
        }

        /* PHONE */

        @media (max-width: 600px) {

            .page {
                padding: 20px 15px 20px;
            }

            .logo {
                width: 250px;
                max-width: 85%;
                margin-bottom: 25px;
            }

            .information {
                font-size: 26px;
                margin-bottom: 25px;
            }

            .languages {
                gap: 30px;
            }

            .language img {
                width: 115px;
                margin-bottom: 12px;
            }

            .language-name {
                font-size: 23px;
            }

            .email {
                padding-top: 35px;
            }

            .email img {
                width: 60px;
            }

            .email a {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <!-- LOGO -->
        <img src="logo.png" alt="Business Logo" class="logo">


        <!-- INFORMATION -->
        <div class="information">
            Información
        </div>


        <!-- ENGLISH / SPANISH -->
        <div class="languages">

            <!-- ENGLISH -->
            <a href="english.html" class="language">
                <img src="flag.png" alt="English">
                <div class="language-name">English</div>
            </a>


            <!-- SPANISH -->
            <a href="spanish.html" class="language">
                <img src="bandera.png" alt="Español">
                <div class="language-name">Español</div>
            </a>

        </div>


        <!-- EMAIL -->
        <div class="email">

            <a href="mailto:jbautistarrt@gmail.com">

                <img src="mail.png" alt="Email">

            </a>

        </div>

    </div>

</body>
</html>
